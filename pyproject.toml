[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadguard-ai"
version = "0.1.0"
description = "Road damage detection, evaluation, and deployment with YOLO"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Faris Mohamed Kishtah" }]
dependencies = [
  "gradio>=5.49,<6",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<4",
  "Pillow>=10.4,<13",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "ultralytics>=8.4.0,<9",
]

[project.optional-dependencies]
dev = [
  "imagehash>=4.3,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roadguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["integration: requires real trained weights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

